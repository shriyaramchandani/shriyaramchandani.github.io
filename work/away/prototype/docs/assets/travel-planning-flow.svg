<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1410" viewBox="0 0 1100 1410" role="img" aria-labelledby="title desc"><title id="title">Away — travel planning flow</title><desc id="desc">Visa, discover things to do, narrow down choices, plan days in each city, book hotels and transport, then book attraction tickets. Itinerary planning and hotel and transport bookings inform each other. Research is overloaded and fragmented; bookings are scattered. Budget and safety remain open considerations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#687363" stroke-width="1.5"/></marker></defs><style>text{font-family:"DM Sans",sans-serif;fill:#252522}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:700}.heading{font-family:"DM Sans",sans-serif;font-size:44px;font-weight:500;letter-spacing:-1.5px}.step{font-size:21px;font-weight:500}.body{font-size:16px;fill:#686963}.pain{font-size:16px;fill:#8c5141}.tag{font-size:12px;letter-spacing:1.5px;font-weight:700;fill:#8c5141}.line{fill:none;stroke:#687363;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1100" height="1410" fill="#faf9f6"/><text x="64" y="66" class="eyebrow" fill="#777970">AWAY / THE PLANNING JOURNEY</text><text x="64" y="127" class="heading">From possibility to a plan.</text><text x="64" y="165" class="body">Current journey, friction points, and opportunities from the initial sketch.</text><text x="64" y="228" class="eyebrow">TRAVELLER FLOW</text><text x="672" y="228" class="eyebrow">FRICTION &amp; OPPORTUNITIES</text><rect x="64" y="260" width="510" height="110" rx="16" fill="#ffffff" stroke="#e4e3dd"/><circle cx="99" cy="294" r="15" fill="#eeefe9"/><text x="94" y="300" class="body">1</text><text x="129" y="299" class="step">Visa</text><text x="129" y="336" class="body">Start with visa planning.</text><path class="line" d="M319 370 V399"/><rect x="64" y="405" width="510" height="110" rx="16" fill="#ffffff" stroke="#e4e3dd"/><circle cx="99" cy="439" r="15" fill="#eeefe9"/><text x="94" y="445" class="body">2</text><text x="129" y="444" class="step">Discover things to do</text><text x="129" y="481" class="body">Explore the possibilities for the trip.</text><path class="line" d="M319 515 V544"/><rect x="64" y="550" width="510" height="110" rx="16" fill="#ffffff" stroke="#e4e3dd"/><circle cx="99" cy="584" r="15" fill="#eeefe9"/><text x="94" y="590" class="body">3</text><text x="129" y="589" class="step">Narrow down the choices</text><text x="129" y="626" class="body">Decide what matters most to you.</text><path class="line" d="M319 660 V689"/><rect x="64" y="695" width="510" height="110" rx="16" fill="#ffffff" stroke="#e4e3dd"/><circle cx="99" cy="729" r="15" fill="#eeefe9"/><text x="94" y="735" class="body">4</text><text x="129" y="734" class="step">Plan days in each city</text><text x="129" y="771" class="body">Turn the shortlist into an itinerary.</text><path class="line" d="M319 805 V834"/><rect x="64" y="840" width="510" height="110" rx="16" fill="#ffffff" stroke="#e4e3dd"/><circle cx="99" cy="874" r="15" fill="#eeefe9"/><text x="94" y="880" class="body">5</text><text x="129" y="879" class="step">Book hotels &amp; transport</text><text x="129" y="916" class="body">Arrange stays and travel between stops.</text><path class="line" d="M319 950 V979"/><rect x="64" y="985" width="510" height="110" rx="16" fill="#ffffff" stroke="#e4e3dd"/><circle cx="99" cy="1019" r="15" fill="#eeefe9"/><text x="94" y="1025" class="body">6</text><text x="129" y="1024" class="step">Book attraction tickets</text><text x="129" y="1061" class="body">Reserve the visits in your plan.</text><path class="line" marker-start="url(#arrow)" d="M574 750 H612 V895 H574"/><text x="632" y="810" class="body">Refine together</text><path d="M574 445 H652" stroke="#c5b8ac" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="660" y="405" width="376" height="155" rx="14" fill="#f3ece5"/><text x="682" y="434" class="tag">RESEARCH OVERLOAD</text><text x="682" y="465" class="pain">Too much information; no clear process.</text><text x="682" y="490" class="pain">Details get lost across Instagram saves</text><text x="682" y="515" class="pain">and ChatGPT conversations.</text><path d="M574 615 H652" stroke="#c5b8ac" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="660" y="575" width="376" height="112" rx="14" fill="#f3ece5"/><text x="682" y="604" class="tag">PERSONAL PRIORITIES</text><text x="682" y="635" class="pain">What stays top of mind shapes</text><text x="682" y="660" class="pain">the destinations and experiences chosen.</text><path d="M574 895 H652" stroke="#c5b8ac" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="660" y="855" width="376" height="130" rx="14" fill="#f3ece5"/><text x="682" y="884" class="tag">FRAGMENTED BOOKINGS</text><text x="682" y="915" class="pain">Reservations and confirmations are</text><text x="682" y="940" class="pain">scattered across emails and screenshots.</text><rect x="64" y="1174" width="972" height="158" rx="16" fill="#eeefe9"/><text x="88" y="1206" class="eyebrow">CONSIDER THROUGHOUT</text><text x="88" y="1244" class="step">Budget &amp; safety</text><text x="88" y="1276" class="body">Budget is an open question in the sketch; safety is noted as a concern.</text><text x="88" y="1301" class="body">Opportunity: contextual suggestions that help travellers move from a plan to booking.</text><text x="64" y="1375" class="body">Cleaned from the initial sketch · Proposed opportunities are not implemented features.</text></svg>