<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".16 .2" numOctaves="3" seed="18" stitchTiles="stitch" result="grain"/>
    <feDiffuseLighting in="grain" surfaceScale="2.2" diffuseConstant="1" lighting-color="#fff" result="relief"><feDistantLight azimuth="225" elevation="65"/></feDiffuseLighting>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="fibres" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".035 .11" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="320" height="320" fill="#faf9f4"/>
  <rect width="320" height="320" filter="url(#paper)" opacity=".065" style="mix-blend-mode:multiply"/>
  <rect width="320" height="320" filter="url(#fibres)" opacity=".015" style="mix-blend-mode:multiply"/>
</svg>
